services:
  postgres:
    image: postgres:16-alpine
    container_name: finawa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - finawa-net


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finawa-backend:latest
    container_name: finawa-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-7333}:7333"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      SERVER_PORT: ${SERVER_PORT}

      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY: ${JWT_ACCESS_TOKEN_VALIDITY}
      JWT_REFRESH_TOKEN_VALIDITY: ${JWT_REFRESH_TOKEN_VALIDITY}
      JWT_REFRESH_TOKEN_VALIDITY_REMEMBER: ${JWT_REFRESH_TOKEN_VALIDITY_REMEMBER}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: ${MAIL_AUTH}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TOKEN_VALIDITY: ${MAIL_TOKEN_VALIDITY}

      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT}

    volumes:
      - ./data/upload:/app/upload

    networks:
      - finawa-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: finawa-frontend:latest
    container_name: finawa-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT}:80"

    networks:
      - finawa-net


networks:
  finawa-net:
    driver: bridge
