server:
  port: ${SERVER_PORT:7333}
  max-http-request-header-size: 64KB
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1
  servlet:
      context-path: /finawa-api/v1
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: finawa
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:noreply@finawa.sn}
    verification-url: ${cors.allowed-origins}/auth/verify-email
    token-validity-seconds: ${MAIL_TOKEN_VALIDITY:86400} # 24 hours

security-jwt:
  base64-secret: ${JWT_BASE64_SECRET:MmMzN2VlODJhN2U3NDk2NzQ2ZjE4Nzg3ZDkxYzg5ZDdkZDEwMTdjYWM3OWRiYjQwOWU4M2NiYTdmOThkYTU3OTI3Nzg2YTAwYTc2ODEyMzgwNjhiYTU2MTkyNDNmNWJiODc5Y2M4MWVhNjJhYTU3ZjRmNzEzZDhlZmYxNDlhYWM=}
  access-token-validity-time: ${JWT_ACCESS_TOKEN_VALIDITY:900000} # 15 min
  refresh-token-validity-time: ${JWT_REFRESH_TOKEN_VALIDITY:86400000} # 1 day
  refresh-token-validity-time-remember-me: ${JWT_REFRESH_TOKEN_VALIDITY_REMEMBER:604800000} # 7 days

storage-document:
   file-storage-root-path: ${FILE_STORAGE_ROOT:${user.dir}/src/main/resources/upload}


---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finawa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finawa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:finawa}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
