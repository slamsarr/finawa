spring:
  datasource:
    url: jdbc:h2:mem:finawa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false

security-jwt:
  base64-secret: dGVzdC1zZWNyZXQta2V5LWZvci1maW5hd2Etand0LXRva2VuLXRlc3RzLW1pbmltdW0zMmJ5dGVz
  token-validity-in-seconds: 3600
  token-validity-in-seconds-for-remember-me: 3600

finawa-cors:
  cors:
    allowed-origins: "http://localhost:4200"
